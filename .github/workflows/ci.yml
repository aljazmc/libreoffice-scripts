name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck comes with the ubuntu-latest runner
      - run: shellcheck --version
      - run: shellcheck project.sh tests/sh/*.sh

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # none of these needs LibreOffice: they check arguments, estimates and
      # the documents themselves; the export tests skip without it
      - run: for test in tests/sh/test_*.sh; do bash "$test" || exit 1; done
      - run: python3 -m unittest discover tests/py -v
